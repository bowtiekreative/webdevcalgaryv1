# Local headless WordPress stack.
#
#   docker compose up -d
#   ./scripts/wp-bootstrap.sh     # installs core + WPGraphQL + Meta Box
#
# WordPress admin : http://localhost:8080/wp-admin
# GraphQL endpoint: http://localhost:8080/graphql

name: app

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    command:
      # WPGraphQL/WordPress behave best on utf8mb4, and the modern default
      # authentication plugin is fine for the official wordpress image.
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-wordpress}
      MYSQL_USER: ${MYSQL_USER:-wordpress}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Exposed so you can point Sequel Ace / TablePlus / mysqldump at it.
      - "${MYSQL_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  wordpress:
    image: wordpress:6.8-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-1}
      WORDPRESS_CONFIG_EXTRA: |
        /* Headless: where the Astro front end lives. */
        define( 'APP_FRONTEND_URL', '${FRONTEND_URL:-http://localhost:4321}' );
        /* Shared secret for draft previews (must match the Astro side). */
        define( 'APP_PREVIEW_SECRET', '${PREVIEW_SECRET:-dev-preview-secret}' );
        /* Optional: POSTed to on publish to trigger a front-end rebuild. */
        define( 'APP_BUILD_HOOK_URL', '${BUILD_HOOK_URL:-}' );
        /* Shared secret the Astro server presents to the auth/billing API.
           Must equal WP_SHARED_SECRET in web/.env. */
        define( 'APP_SHARED_SECRET', '${APP_SHARED_SECRET:-}' );
        /* Emailit, used for WordPress's own transactional mail. */
        define( 'APP_EMAILIT_API_KEY', '${EMAILIT_API_KEY:-}' );
        define( 'APP_EMAILIT_FROM', '${EMAILIT_FROM:-}' );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes:
      - wp_data:/var/www/html
      # Our headless glue is mounted as must-use plugins so it is always on
      # and cannot be deactivated by accident in the admin.
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/uploads:/var/www/html/wp-content/uploads
      # Outside wp-content so WordPress never tries to load it as a plugin.
      # See wordpress/tests/schema-contract.php for how to run it.
      - ./wordpress/tests:/var/www/html/app-tests:ro
      - ./wordpress/bin:/var/www/html/app-bin:ro
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    extra_hosts:
      # Lets WordPress reach the Astro dev server on the host, so BUILD_HOOK_URL
      # can point at http://host.docker.internal:4321/_refresh. On Linux this
      # mapping is not automatic, hence host-gateway.
      - "host.docker.internal:host-gateway"

  # One-shot helper container. Used by scripts/wp-bootstrap.sh; it exits
  # immediately when run on its own.
  wpcli:
    image: wordpress:cli-php8.3
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${MYSQL_DATABASE:-wordpress}
      WORDPRESS_DB_USER: ${MYSQL_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:-wordpress}
    volumes:
      - wp_data:/var/www/html
      - ./wordpress/mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./wordpress/uploads:/var/www/html/wp-content/uploads
      - ./wordpress/bin:/var/www/html/app-bin:ro
    # `wp` needs to run as the same uid as the apache container's files.
    user: "33:33"
    entrypoint: ["wp"]
    command: ["--info"]
    extra_hosts:
      # Same reason as the wordpress service: wp-cli fires the same save hooks,
      # so it needs to reach BUILD_HOOK_URL on the host too.
      - "host.docker.internal:host-gateway"

volumes:
  db_data:
  wp_data:
