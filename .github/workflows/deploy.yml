name: Deploy to Dokploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to redeploy
        type: choice
        default: web
        options: [web, wordpress, both]

concurrency:
  # One deploy at a time. A queued second push replaces the queued first —
  # there is no value in deploying an already-superseded commit.
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Dokploy
    runs-on: ubuntu-latest
    environment: production

    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
      WEB_ID: ${{ secrets.DOKPLOY_WEB_ID }}
      WP_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
      TARGET: ${{ inputs.target || 'web' }}

    steps:
      - uses: actions/checkout@v4

      # CI runs as a separate workflow, so `needs:` cannot reach it. Wait for
      # its conclusion on this exact commit instead — deploying a commit whose
      # build is broken is the one failure mode worth this much ceremony.
      - name: Require a green CI run for this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do
            conclusion="$(gh run list \
              --workflow=ci.yml \
              --commit="${{ github.sha }}" \
              --json conclusion,status \
              --jq '.[0] | select(.status == "completed") | .conclusion' || true)"

            case "$conclusion" in
              success) echo "CI passed."; exit 0 ;;
              failure|cancelled|timed_out)
                echo "::error::CI concluded '$conclusion' — not deploying."
                exit 1
                ;;
            esac

            echo "Waiting for CI (attempt ${attempt}/60)…"
            sleep 20
          done

          echo "::error::Timed out waiting for CI."
          exit 1

      - name: Check the secrets are set
        run: |
          missing=0
          for name in DOKPLOY_URL DOKPLOY_KEY WEB_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set."
              missing=1
            fi
          done
          exit "$missing"

      # WordPress first: the Astro site is prerendered, so its build queries
      # WordPress for content. Deploying the front end against a WordPress that
      # is mid-restart bakes stale — or missing — content into the static site.
      - name: Deploy WordPress
        if: github.event_name == 'workflow_dispatch' && (inputs.target == 'wordpress' || inputs.target == 'both')
        run: |
          test -n "$WP_ID" || { echo "::error::DOKPLOY_COMPOSE_ID is not set."; exit 1; }
          ./.github/scripts/dokploy-deploy.sh compose "$WP_ID" wordpress

      - name: Deploy the Astro front end
        if: github.event_name == 'push' || inputs.target == 'web' || inputs.target == 'both'
        run: ./.github/scripts/dokploy-deploy.sh app "$WEB_ID" web

      - name: Summary
        if: always()
        run: |
          {
            echo "### Dokploy deploy"
            echo
            echo "- Commit: \`${GITHUB_SHA:0:8}\`"
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Target: ${TARGET}"
          } >> "$GITHUB_STEP_SUMMARY"
